[tcp.routers]

  [tcp.routers."routertcp1"]
    service = "applicationtcp-1"

[tcp.services]

  [tcp.services.applicationtcp-1.loadBalancer]
    [[tcp.services.applicationtcp-1.loadBalancer.servers]]
      address = "http://172.17.0.9:80"

