---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
apiVersion: v1
kind: Secret
metadata:
  name: bar-cert
  namespace: bar

data:
  tls.crt: 
  tls.key: 

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gw
  namespace: bar
  creationTimestamp: "2024-01-01T00:00:01Z"
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - kind: Secret
            name: bar-cert
            group: ""
      allowedRoutes:
        namespaces:
          from: Same

