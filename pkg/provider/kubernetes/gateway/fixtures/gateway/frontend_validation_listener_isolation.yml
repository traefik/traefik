---
apiVersion: v1
kind: Secret
metadata:
  name: supersecret
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-configmap
  namespace: default
data:
  ca.crt: "CA1"

---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

# Two Gateways share the websecure entry point:
# - my-gateway has a catch-all listener with no frontend validation.
# - my-secure-gateway has a foo.com listener that requires a client certificate.

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: https-catchall
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: All

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-secure-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  tls:
    frontend:
      default:
        validation:
          mode: AllowValidOnly
          caCertificateRefs:
            - kind: ConfigMap
              name: ca-configmap
              group: ""
  listeners:
    - name: https-secure
      protocol: HTTPS
      port: 443
      hostname: foo.com
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: All

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-catchall
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      sectionName: https-catchall
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /catchall
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-secure
  namespace: default
spec:
  parentRefs:
    - name: my-secure-gateway
      sectionName: https-secure
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /secure
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""
