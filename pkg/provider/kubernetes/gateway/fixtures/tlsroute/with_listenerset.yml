---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
kind: ListenerSet
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-listenerset
  namespace: default
spec:
  parentRef:
    name: my-gateway
    namespace: default
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: tls
      protocol: TLS
      port: 9001
      hostname: foo.example.com
      tls:
        mode: Passthrough

---
kind: TLSRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: tls-app-1
  namespace: default
spec:
  parentRefs:
    - name: my-listenerset
      kind: ListenerSet
      group: gateway.networking.k8s.io
  rules:
    - backendRefs:
        - name: whoamitcp
          port: 9000
          weight: 1
          kind: Service
          group: ""
