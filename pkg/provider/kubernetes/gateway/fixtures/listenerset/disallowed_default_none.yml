---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec: # No allowedListeners, defaults to allowing no ListenerSet.
  gatewayClassName: my-gateway-class
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
kind: ListenerSet
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-listenerset
  namespace: default
spec:
  parentRef:
    name: my-gateway
    namespace: default
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
