---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
apiVersion: v1
kind: Secret
metadata:
  name: default-a-cert
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
apiVersion: v1
kind: Secret
metadata:
  name: default-b-cert
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gw
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: https-a
      protocol: HTTPS
      port: 443
      hostname: a.example.com
      tls:
        certificateRefs:
          - kind: Secret
            name: default-a-cert
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        certificateRefs:
          - kind: Secret
            name: default-b-cert
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-b
      protocol: HTTPS
      port: 443
      hostname: b.example.com
      tls:
        certificateRefs:
          - kind: Secret
            name: default-b-cert
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
