---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: udp-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: udp
      protocol: UDP
      port: 5300
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: UDPRoute

---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: udp-route
  namespace: default
spec:
  parentRefs:
    - name: udp-gateway
      sectionName: udp
  rules:
    - backendRefs:
        - name: udp-backend
          port: 5300

---
apiVersion: v1
kind: Service
metadata:
  name: udp-backend
  namespace: default
spec:
  ports:
    - name: udp
      protocol: UDP
      port: 5300

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: udp-backend-abc
  namespace: default
  labels:
    kubernetes.io/service-name: udp-backend
addressType: IPv4
ports:
  - name: udp
    protocol: UDP
    port: 5300
endpoints:
  - addresses:
      - 10.0.0.1
    conditions:
      ready: true
