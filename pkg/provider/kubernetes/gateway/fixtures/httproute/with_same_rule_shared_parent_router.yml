---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: precise
      protocol: HTTP
      port: 80
      hostname: abc.example.com
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-wildcard-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: wildcard
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-wildcard
  namespace: default
  creationTimestamp: "2024-01-01T00:00:02Z"
spec:
  parentRefs:
    - name: my-wildcard-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - abc.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /foo
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-precise
  namespace: default
  creationTimestamp: "2024-01-01T00:00:01Z"
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - abc.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /foo
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""
