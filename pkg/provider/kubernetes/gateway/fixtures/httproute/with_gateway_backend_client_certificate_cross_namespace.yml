---
apiVersion: v1
kind: Secret
metadata:
  name: client-cert
  namespace: bar

data:
  tls.crt: 
  tls.key: 

---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: client-cert
        namespace: bar

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-app-1
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "foo.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /bar
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""
    - matches:
        - path:
            type: Exact
            value: /foo
      backendRefs:
        - name: whoami2
          port: 8080
          weight: 1
          kind: Service
          group: ""

---
kind: BackendTLSPolicy
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: policy-1
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: whoami
  validation:
    hostname: whoami
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: ca-file

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-file
  namespace: default
data:
  ca.crt: "CA1"

---
kind: ReferenceGrant
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: secret-from-default
  namespace: bar
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default
  to:
    - group: ""
      kind: Secret
      name: client-cert
