apiVersion: v1
kind: Secret
metadata:
  name: secret-ech
  namespace: default

data:
  tls.ech: ZWNoLWN1cnJlbnQ=

---
apiVersion: v1
kind: Secret
metadata:
  name: secret-ech-retired
  namespace: default

data:
  tls.ech: ZWNoLXJldGlyZWQ=

---
apiVersion: v1
kind: Secret
metadata:
  name: secret-ech-wrong-key
  namespace: default

data:
  tls.key: ZWNoLWN1cnJlbnQ=

---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: foo
  namespace: default

spec:
  minVersion: VersionTLS13
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_RSA_WITH_AES_256_GCM_SHA384
  echKeys:
    - secret-ech
    - secret-ech-wrong-key
    - secret-ech-absent
  echDecryptOnlyKeys:
    - secret-ech-retired

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route
  namespace: default

spec:
  entryPoints:
    - web

  routes:
  - match: Host(`foo.com`) && PathPrefix(`/bar`)
    kind: Rule
    priority: 12
    services:
    - name: whoami
      port: 80

  tls:
    options:
      name: foo
