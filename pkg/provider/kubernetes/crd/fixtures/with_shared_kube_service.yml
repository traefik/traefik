apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route.plain
  namespace: default

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`foo.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
        - name: whoami2
          port: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route.mtls
  namespace: default

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`bar.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
          serversTransport: mtls
        - name: whoami2
          port: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route.namespaces
  namespace: default

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`baz.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
        - name: whoami
          port: 80
          namespace: cross-ns

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route.duplicate
  namespace: default

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`qux.com`)
      kind: Rule
      services:
        - name: whoami
          port: 80
        - name: whoami
          port: 80
          passHostHeader: false
