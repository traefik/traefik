apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test.route
  namespace: default

spec:
  entryPoints:
    - foo

  routes:
  - match: Host(`foo.com`) && PathPrefix(`/bar`)
    kind: Rule
    priority: 12
    services:
    - name: cross-ns-tr-svc@kubernetescrd
      kind: TraefikService

---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: tr-svc
  namespace: cross-ns

spec:
  weighted:
    services:
      - name: whoami-svc
        weight: 1
        port: 80
