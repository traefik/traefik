apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tap
  namespace: default

spec:
  tap:
    request:
      service:
        name: whoami
        port: 80
      path: /records/requests
      recordBody: true
      maxRecordBodySize: 1024
      rejectOnRecordError: true
      timeout: 5s
    response:
      service:
        name: whoami
        port: 80
      recordBody: false
      maxBodySize: 2048
      requestHeaders:
        - X-Request-Id
      timeout: 30
