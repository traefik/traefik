---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/nonexistent-secret"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-canary-only.localhost
      http:
        paths:
          - path: /canary
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
