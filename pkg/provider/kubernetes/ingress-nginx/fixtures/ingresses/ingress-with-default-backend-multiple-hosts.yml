---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: ingress-with-default-backend-multiple-hosts
  namespace: default

spec:
  ingressClassName: nginx
  defaultBackend:
    service:
      name: whoami
      port:
        number: 80

  rules:
    - host: one.whoami.localhost
    - host: two.whoami.localhost
