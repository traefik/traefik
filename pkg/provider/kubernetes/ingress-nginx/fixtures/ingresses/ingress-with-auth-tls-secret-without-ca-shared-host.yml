---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: without-ca-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/whoami-tls"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-without-ca.localhost
      http:
        paths:
          - path: /without-ca
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: owner-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-without-ca.localhost
      http:
        paths:
          - path: /owner
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
