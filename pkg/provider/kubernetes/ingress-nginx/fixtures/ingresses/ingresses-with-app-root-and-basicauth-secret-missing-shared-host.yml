---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  # Read before app-root-ingress: Ingresses with the same creation timestamp are read in descending name order.
  name: missing-secret-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret-type: "auth-file"
    nginx.ingress.kubernetes.io/auth-secret: "default/missing-basic-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    nginx.ingress.kubernetes.io/app-root: /admin

spec:
  ingressClassName: nginx
  rules:
    - host: whoami.localhost
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: app-root-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/app-root: /app

spec:
  ingressClassName: nginx
  rules:
    - host: whoami.localhost
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
