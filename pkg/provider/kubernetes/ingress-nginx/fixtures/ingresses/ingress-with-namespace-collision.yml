apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-web
  namespace: team

spec:
  ingressClassName: nginx
  rules:
    - host: whoami.localhost
      http:
        paths:
          - path: /dash
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: team-dev

spec:
  ingressClassName: nginx
  rules:
    - host: whoami.localhost
      http:
        paths:
          - path: /dot
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
