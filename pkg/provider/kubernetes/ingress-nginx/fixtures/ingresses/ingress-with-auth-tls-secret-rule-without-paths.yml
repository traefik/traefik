---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rule-without-paths-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-rule-without-paths.localhost

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-rule-without-paths.localhost
      http:
        paths:
          - path: /public
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
