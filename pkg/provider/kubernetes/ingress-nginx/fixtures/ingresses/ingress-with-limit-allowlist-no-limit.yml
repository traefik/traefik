apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-with-limit-allowlist-no-limit
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/limit-allowlist: "10.0.0.0/24"
spec:
  ingressClassName: nginx
  rules:
    - host: whoami.localhost
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
