---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-canary.localhost
      http:
        paths:
          - path: /public
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-canary.localhost
      http:
        paths:
          - path: /public
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
