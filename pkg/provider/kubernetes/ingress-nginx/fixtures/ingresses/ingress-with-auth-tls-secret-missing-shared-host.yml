---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing-secret-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/nonexistent-secret"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-missing-rule-without-paths.localhost
    - host: auth-tls-missing-shared-host.localhost
      http:
        paths:
          - path: /missing
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"
    nginx.ingress.kubernetes.io/server-alias: "auth-tls-missing-alias.localhost"

spec:
  ingressClassName: nginx
  rules:
    - host: auth-tls-missing-shared-host.localhost
      http:
        paths:
          - path: /public
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
