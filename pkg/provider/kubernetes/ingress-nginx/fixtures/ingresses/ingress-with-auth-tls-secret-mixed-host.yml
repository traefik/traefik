---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: mtls-mixed.localhost
      http:
        paths:
          - path: /public
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mtls-mixed.localhost
      secretName: whoami-tls
  rules:
    - host: mtls-mixed.localhost
      http:
        paths:
          - path: /protected
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optional-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/ca-secret"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"

spec:
  ingressClassName: nginx
  rules:
    - host: mtls-mixed.localhost
      http:
        paths:
          - path: /optional
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
