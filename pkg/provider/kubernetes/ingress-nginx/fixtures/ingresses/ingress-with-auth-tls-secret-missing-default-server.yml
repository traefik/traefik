---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing-secret-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "default/nonexistent-secret"

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /missing
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: known-host-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/server-alias: "known-host-alias.localhost"

spec:
  ingressClassName: nginx
  rules:
    - host: known-host.localhost
      http:
        paths:
          - path: /known
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80
