apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-with-auth-tls-secret-cross-namespace-owner
  namespace: a
  creationTimestamp: "2026-01-01T00:00:00Z"
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: "a/ca"

spec:
  ingressClassName: nginx
  rules:
    - host: tls-option-cross-namespace-owner.localhost
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: whoami
                port:
                  number: 80

