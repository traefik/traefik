---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-no-auth-tls
  namespace: default

spec:
  ingressClassName: nginx
  rules:
    - host: plain.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
