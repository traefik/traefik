name: Test Ingress NGINX e2e

on:
  pull_request:
    branches:
      - '*'
    paths:
      - '.github/workflows/test-ingress-nginx-e2e.yaml'
      - 'pkg/provider/kubernetes/ingress-nginx/**'
      - 'integration/ingress-nginx-e2e/**'
      - 'integration/ingress_nginx_e2e_test.go'
      - 'integration/integration_test.go'

env:
  CGO_ENABLED: 0

permissions:
  contents: read

jobs:

  test-ingress-nginx-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: Avoid generating webui
        run: |
          touch webui/static/index.html

      - name: Ingress NGINX e2e test
        run: |
          make test-ingress-nginx-e2e
