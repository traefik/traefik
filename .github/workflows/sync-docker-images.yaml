name: Sync Docker Images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Run every day

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write
    if: github.repository == 'traefik/traefik'

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sync
        run: |
          EXCLUDED_TAGS="1.7.9-alpine v1.0.0-beta.392 v1.0.0-beta.404 v1.0.0-beta.704 v1.0.0-rc1 v1.7.9-alpine"
          EXCLUDED_REGEX=$(echo $EXCLUDED_TAGS | sed 's/ /|/g')
          diff <(crane ls traefik) <(crane ls ghcr.io/traefik/traefik) | grep '^<' | awk '{print $2}' | while read -r tag; do
            [[ "$tag" =~ ^($EXCLUDED_REGEX)$ ]] && continue
            echo "Processing image: traefik:$tag"
            crane cp "traefik:$tag" "ghcr.io/traefik/traefik:$tag"
            # Keyless signature as this workflow, covering the index and every platform manifest.
            cosign sign --yes --recursive "ghcr.io/traefik/traefik@$(crane digest "ghcr.io/traefik/traefik:$tag")"
          done
          crane cp traefik:latest ghcr.io/traefik/traefik:latest
