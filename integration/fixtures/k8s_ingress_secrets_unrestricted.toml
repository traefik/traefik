[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[api]
  insecure = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"
  [entryPoints.websecure]
    address = ":8443"
    [entryPoints.websecure.http.tls]

[providers.kubernetesIngress]
  namespaces = ["default"]
  disableClusterScopeResources = true
