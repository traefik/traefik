---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Namespace
apiVersion: v1
metadata:
  name: traefik

---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: traefik
  namespace: traefik

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik

spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik/traefik:latest
          imagePullPolicy: Never
          args:
            - --log.level=DEBUG
            - --api.insecure
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.web8080.address=:8080
            - --entrypoints.web8090.address=:8090
            - --entrypoints.tls8443.address=:8443
            - --entrypoints.tls8883.address=:8883
            - --entrypoints.web5300.address=:5300
            - --entrypoints.udp5300.address=:5300/udp
            - --entrypoints.udp5301.address=:5301/udp
            - --entrypoints.udp5302.address=:5302/udp
            - --entrypoints.udp5310.address=:5310/udp
            - --entrypoints.udp5311.address=:5311/udp
            - --entrypoints.udp5312.address=:5312/udp
            # A TCP entryPoint peeks at the first bytes to detect TLS as long as no
            # TCPRoute is programmed on it. The conformance TCP backend speaks first,
            # so without this timeout the connection blocks until the route shows up.
            - --entrypoints.tcp9300.address=:9300
            - --entrypoints.tcp9300.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9301.address=:9301
            - --entrypoints.tcp9301.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9302.address=:9302
            - --entrypoints.tcp9302.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9310.address=:9310
            - --entrypoints.tcp9310.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9311.address=:9311
            - --entrypoints.tcp9311.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9312.address=:9312
            - --entrypoints.tcp9312.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9313.address=:9313
            - --entrypoints.tcp9313.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9320.address=:9320
            - --entrypoints.tcp9320.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.tcp9321.address=:9321
            - --entrypoints.tcp9321.transport.respondingTimeouts.readTimeout=1s
            - --entrypoints.traefik.address=:9000
            # Route statuses are written as soon as the configuration is built, while
            # the configuration itself waits out the throttling interval before reaching
            # the routers. Conformance tests probe the data plane right after seeing the
            # Accepted status, so the default 2s interval loses the race.
            - --providers.providersThrottleDuration=0s
            - --providers.kubernetesgateway.statusaddress.service.namespace=traefik
            - --providers.kubernetesgateway.statusaddress.service.name=traefik
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: web8080
              containerPort: 8080
            - name: web8090
              containerPort: 8090
            - name: tls8443
              containerPort: 8443
            - name: tls8883
              containerPort: 8883
            - name: web5300
              containerPort: 5300
            - name: udp5300
              containerPort: 5300
              protocol: UDP
            - name: udp5301
              containerPort: 5301
              protocol: UDP
            - name: udp5302
              containerPort: 5302
              protocol: UDP
            - name: udp5310
              containerPort: 5310
              protocol: UDP
            - name: udp5311
              containerPort: 5311
              protocol: UDP
            - name: udp5312
              containerPort: 5312
              protocol: UDP
            - name: tcp9300
              containerPort: 9300
            - name: tcp9301
              containerPort: 9301
            - name: tcp9302
              containerPort: 9302
            - name: tcp9310
              containerPort: 9310
            - name: tcp9311
              containerPort: 9311
            - name: tcp9312
              containerPort: 9312
            - name: tcp9313
              containerPort: 9313
            - name: tcp9320
              containerPort: 9320
            - name: tcp9321
              containerPort: 9321
            - name: traefik
              containerPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - port: 80
      name: web
      targetPort: web
    - port: 443
      name: websecure
      targetPort: websecure
    - port: 8080
      name: web8080
      targetPort: web8080
    - port: 8090
      name: web8090
      targetPort: web8090
    - port: 8443
      name: tls8443
      targetPort: tls8443
    - port: 8883
      name: tls8883
      targetPort: tls8883
    - port: 5300
      name: web5300
      targetPort: web5300
    - port: 5300
      name: udp5300
      targetPort: udp5300
      protocol: UDP
    - port: 5301
      name: udp5301
      targetPort: udp5301
      protocol: UDP
    - port: 5302
      name: udp5302
      targetPort: udp5302
      protocol: UDP
    - port: 5310
      name: udp5310
      targetPort: udp5310
      protocol: UDP
    - port: 5311
      name: udp5311
      targetPort: udp5311
      protocol: UDP
    - port: 5312
      name: udp5312
      targetPort: udp5312
      protocol: UDP
    - port: 9300
      name: tcp9300
      targetPort: tcp9300
    - port: 9301
      name: tcp9301
      targetPort: tcp9301
    - port: 9302
      name: tcp9302
      targetPort: tcp9302
    - port: 9310
      name: tcp9310
      targetPort: tcp9310
    - port: 9311
      name: tcp9311
      targetPort: tcp9311
    - port: 9312
      name: tcp9312
      targetPort: tcp9312
    - port: 9313
      name: tcp9313
      targetPort: tcp9313
    - port: 9320
      name: tcp9320
      targetPort: tcp9320
    - port: 9321
      name: tcp9321
      targetPort: tcp9321
    - port: 9000
      name: traefik
      targetPort: traefik
