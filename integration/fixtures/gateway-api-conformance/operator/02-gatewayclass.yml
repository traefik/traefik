---
apiVersion: gateway.traefik.io/v1alpha1
kind: TraefikProxy
metadata:
  name: conformance
spec:
  deployment:
    replicas: 1
    # The tag is fixed, and not latest, so that the provisioned pods keep the
    # image side loaded into the node: a latest tag defaults imagePullPolicy to
    # Always, which pulls the released Traefik over the one built from the
    # working tree.
    image: traefik/traefik:conformance
  service:
    type: LoadBalancer
  logs:
    level: DEBUG

---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
  parametersRef:
    group: gateway.traefik.io
    kind: TraefikProxy
    name: conformance
