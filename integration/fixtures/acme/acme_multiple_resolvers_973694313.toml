[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"

[entryPoints]
  [entryPoints.web]
    address = ":5002"
  [entryPoints.websecure]
    address = ":5001"



[certificatesResolvers.default.acme]
  email = "test@traefik.io"
  storage = "/tmp/acme.json"
  keyType = ""
  caServer = "https://172.31.42.2:14000/dir"

  
  [certificatesResolvers.default.acme.httpChallenge]
    entryPoint = "web"
  

  



[certificatesResolvers.tchouk.acme]
  email = "test@traefik.io"
  storage = "/tmp/acme.json"
  keyType = "EC256"
  caServer = "https://172.31.42.2:14000/dir"

  

  
  [certificatesResolvers.tchouk.acme.tlsChallenge]
  



[api]
  insecure = true

[providers.file]
  filename = "fixtures/acme/acme_multiple_resolvers_973694313.toml"

## dynamic configuration ##

[http.services]
  [http.services.test.loadBalancer]
    [[http.services.test.loadBalancer.servers]]
      url = "http://127.0.0.1:9010"

[http.routers]
  [http.routers.test]
    entryPoints = ["websecure"]
    rule = "Host(`traefik.acme.wtf`)"
    service = "test"
    [http.routers.test.tls]
      certResolver = "default"

  [http.routers.tchouk]
    entryPoints = ["websecure"]
    rule = "Host(`tchouk.acme.wtf`)"
    service = "test"
    [http.routers.tchouk.tls]
      certResolver = "tchouk"
