[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"

[api]
  insecure = true

[providers]
  [providers.swarm]
    endpoint = "{{ .DockerHost }}"
    exposedByDefault = false
    useBindPortIP = true
    refreshSeconds = "2s"
