[global]
  checkNewVersion = false
  sendAnonymousUsage = false

[log]
  level = "DEBUG"
  noColor = true

[entryPoints]
  [entryPoints.web]
    address = ":8000"
    [entryPoints.web.transport.respondingTimeouts]
      readTimeout = "1s"

[accessLog]
  format = "json"

[api]
  insecure = true

[providers.file]
  filename = "{{ .SelfFilename }}"

## dynamic configuration ##

[http.routers]
  [http.routers.router1]
    service = "service1"
    rule = "Path(`/readTimeout`)"
    [http.routers.router1.respondingTimeouts]
      readTimeout = "3s"

  # No router readTimeout: the entrypoint readTimeout is the only bound on the request body.
  [http.routers.router2]
    service = "service1"
    rule = "Path(`/noReadTimeout`)"

[http.services]
  [http.services.service1]
    [http.services.service1.loadBalancer]
      [[http.services.service1.loadBalancer.servers]]
        url = "{{ .BackendURL }}"
