---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tlsoptions.traefik.io
spec:
  group: traefik.io
  names:
    kind: TLSOption
    listKind: TLSOptionList
    plural: tlsoptions
    singular: tlsoption
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TLSOption is the CRD implementation of a Traefik TLS Option, allowing to configure some parameters of the TLS connection.
          More info: https://doc.traefik.io/traefik/v3.7/reference/routing-configuration/http/tls/tls-certificates/#certificates-stores#tls-options
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TLSOptionSpec defines the desired state of a TLSOption.
            properties:
              alpnProtocols:
                description: |-
                  ALPNProtocols defines the list of supported application level protocols for the TLS handshake, in order of preference.
                  More info: https://doc.traefik.io/traefik/v3.7/reference/routing-configuration/http/tls/tls-certificates/#certificates-stores#alpn-protocols
                items:
                  type: string
                type: array
              cipherSuites:
                description: |-
                  CipherSuites defines the list of supported cipher suites for TLS versions up to TLS 1.2.
                  More info: https://doc.traefik.io/traefik/v3.7/reference/routing-configuration/http/tls/tls-certificates/#certificates-stores#cipher-suites
                items:
                  type: string
                type: array
              clientAuth:
                description: ClientAuth defines the server's policy for TLS Client
                  Authentication.
                properties:
                  clientAuthType:
                    description: ClientAuthType defines the client authentication
                      type to apply.
                    enum:
                    - NoClientCert
                    - RequestClientCert
                    - RequireAnyClientCert
                    - VerifyClientCertIfGiven
                    - RequireAndVerifyClientCert
                    - RequireAndVerifyClientCertWithExpiry
                    type: string
                  expiry:
                    description: Expiry defines the parameters of the client authentication
                      regarding client certificate expiry.
                    properties:
                      crl:
                        description: CRL based expiry configuration
                        properties:
                          http:
                            description: HTTP config for Load mode HTTP
                            properties:
                              errorBackoff:
                                anyOf:
                                - type: integer
                                - type: string
                                description: |-
                                  Error backoff duration for HTTP requests when endpoints are in error
                                  If unset, a default duration is set by traefik admins
                                pattern: ^([0-9]+(ns|us|µs|ms|s|m|h)?)+$
                                x-kubernetes-int-or-string: true
                              expirationStrategy:
                                description: |-
                                  Defines how CRL expiry is handled.
                                  Available values are: "Open", "FailedClosed"
                                  Default: Open
                                enum:
                                - Open
                                - FailedClosed
                                type: string
                              maxCRLBytes:
                                description: |-
                                  Max CRL file size exprimed in bytes.
                                  Default: 1MB
                                format: int64
                                type: integer
                              timeout:
                                anyOf:
                                - type: integer
                                - type: string
                                description: |-
                                  Timeout for HTTP requests used to fetch CRLs for this TLS Options.
                                  If unset, a default timeout configured at the Traefik static level is used.
                                pattern: ^([0-9]+(ns|us|µs|ms|s|m|h)?)+$
                                x-kubernetes-int-or-string: true
                              whitelist:
                                description: CRL Distribution Point whitelist config
                                properties:
                                  distrivutionPoints:
                                    description: CRL locations whitelist
                                    items:
                                      type: string
                                    type: array
                                  enabled:
                                    description: |-
                                      Enables whitelist handling, setting it to false may lead to high memory usage
                                      due to a high number of CRL being stored
                                    type: boolean
                                type: object
                            type: object
                          mode:
                            description: |-
                              Mode denotates how CRL validation will be handled.
                              Available values are: "NOOP", "Lax", "Strict".
                              Default: NOOP.
                            enum:
                            - NOOP
                            - Lax
                            - Strict
                            type: string
                          reloadInterval:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Interval between files reload, setting it to 0 will turn off reload
                              Default: 1H
                            pattern: ^([0-9]+(ns|us|µs|ms|s|m|h)?)+$
                            x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  secretNames:
                    description: SecretNames defines the names of the referenced Kubernetes
                      Secret storing certificate details.
                    items:
                      type: string
                    type: array
                type: object
              curvePreferences:
                description: |-
                  CurvePreferences defines the preferred elliptic curves.
                  More info: https://doc.traefik.io/traefik/v3.7/reference/routing-configuration/http/tls/tls-certificates/#certificates-stores#curve-preferences
                items:
                  type: string
                type: array
              disableSessionTickets:
                description: DisableSessionTickets disables TLS session resumption
                  via session tickets.
                type: boolean
              maxVersion:
                description: |-
                  MaxVersion defines the maximum TLS version that Traefik will accept.
                  Possible values: VersionTLS10, VersionTLS11, VersionTLS12, VersionTLS13.
                  Default: None.
                type: string
              minVersion:
                description: |-
                  MinVersion defines the minimum TLS version that Traefik will accept.
                  Possible values: VersionTLS10, VersionTLS11, VersionTLS12, VersionTLS13.
                  Default: VersionTLS10.
                type: string
              preferServerCipherSuites:
                description: |-
                  PreferServerCipherSuites defines whether the server chooses a cipher suite among his own instead of among the client's.
                  It is enabled automatically when minVersion or maxVersion is set.

                  Deprecated: https://github.com/golang/go/issues/45430
                type: boolean
              sniStrict:
                description: SniStrict defines whether Traefik allows connections
                  from clients connections that do not specify a server_name extension.
                type: boolean
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
